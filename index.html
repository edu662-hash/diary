<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 하루는 어땠나요?</title>
    <!-- 구글 폰트 (Outfit, Gowun Batang) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 영역 -->
        <header class="header">
            <h1 class="main-title">오늘의 하루는 어땠나요?</h1>
            <p class="subtitle">당신의 마음속 이야기를 편하게 나누어 주세요 🌿</p>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <!-- 일기 입력 영역 -->
            <section class="input-section">
                <div class="textarea-wrapper">
                    <textarea 
                        id="diary-input" 
                        placeholder="이곳에 오늘 있었던 일이나 느꼈던 감정을 자유롭게 남겨보세요..." 
                        rows="8"
                    ></textarea>
                    <div class="char-count"><span id="char-count">0</span> 자</div>
                </div>

                <!-- 버튼 영역 -->
                <div class="button-group">
                    <button id="new-diary-btn" class="btn btn-new" type="button">
                        <span class="btn-icon">📄</span>
                        <span class="btn-text">새 일기</span>
                    </button>
                    <button id="stt-btn" class="btn btn-speech" type="button">
                        <span class="btn-icon">🎙️</span>
                        <span class="btn-text">음성 입력</span>
                        <span class="speech-pulse"></span>
                    </button>
                    <button id="analyze-btn" class="btn btn-analyze" type="button">
                        <span class="btn-icon">✨</span>
                        <span class="btn-text">분석 요청</span>
                    </button>
                    <button id="save-btn" class="btn btn-save" type="button">
                        <span class="btn-icon">💾</span>
                        <span class="btn-text">일기 저장</span>
                    </button>
                </div>
            </section>

            <!-- AI 답변 영역 -->
            <section class="response-section">
                <h2 class="response-title">AI의 답변</h2>
                <div id="ai-response-box" class="ai-box empty">
                    <div id="loading-spinner" class="loading-spinner hidden">
                        <div class="spinner"></div>
                        <p class="loading-text">당신의 이야기를 마음 깊이 읽고 있어요...</p>
                    </div>
                    <div id="response-content" class="response-content">
                        <p class="default-text">여기에 AI의 답변이 표시됩니다.</p>
                    </div>
                </div>
            </section>

            <!-- 저장된 일기 목록 영역 -->
            <section class="saved-section">
                <div class="saved-header">
                    <h2 class="saved-title">📖 보관된 일기장</h2>
                    <button id="clear-all-btn" class="btn-clear-all" type="button">🗑️ 보관함 비우기</button>
                </div>
                <div id="saved-diary-list" class="saved-list">
                    <p class="no-saved-text">아직 저장된 일기가 없습니다.</p>
                </div>
            </section>
        </main>

        <!-- 푸터 영역 -->
        <footer class="footer">
            <p>© 2026 따뜻한 마음 일기장 · 당신의 오늘을 응원합니다.</p>
        </footer>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
